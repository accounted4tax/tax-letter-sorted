# Keeps the free Supabase project awake by reading one row every day.
# Uses two GitHub secrets (Settings > Secrets and variables > Actions):
#   SUPABASE_URL       e.g. https://pmngappuatunbhodqipn.supabase.co
#   SUPABASE_ANON_KEY  the project's publishable key (or legacy anon key)
# No secret values are stored in this file.
name: Supabase keep-alive

on:
  schedule:
    - cron: "17 6 * * *"   # every day at 06:17 UTC
  workflow_dispatch:        # lets you run it by hand from the Actions tab

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Read the heartbeat table
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: |
          if [ -z "$SUPABASE_URL" ] || [ -z "$SUPABASE_ANON_KEY" ]; then
            echo "::error::A secret is missing (SUPABASE_URL or SUPABASE_ANON_KEY)"; exit 1; fi
          URL="${SUPABASE_URL%/}"; URL="${URL%/rest/v1}"
          status=$(curl -s -o body.txt -w "%{http_code}" \
            "$URL/rest/v1/heartbeat?select=id&limit=1" \
            -H "apikey: $SUPABASE_ANON_KEY")
          msg=$(head -c 200 body.txt | tr -d '\n')
          if [ "$status" = "200" ]; then
            echo "::notice::Supabase answered HTTP 200: $msg"
          else
            echo "::error::Supabase answered HTTP $status: $msg"; exit 1
          fi
