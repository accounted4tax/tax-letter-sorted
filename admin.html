<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<link rel="icon" href="images/favicon.png" type="image/png">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Admin – Tax Letter Sorted</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600&family=Inter:wght@400;500;600;700&display=swap">
<link rel="stylesheet" href="css/app.css?v=20261110b">
<script src="js/config.js"></script>
<style>
  body{background:var(--bg)}
  .awrap{max-width:1180px;margin:0 auto;padding:0 20px}
  .topbar .awrap{display:flex;align-items:center;justify-content:space-between;gap:12px;padding-top:12px;padding-bottom:12px}
  .who{font-size:13px;color:#C9D2E3;display:flex;gap:12px;align-items:center}
  .who button{background:none;border:1px solid #5B6B8C;color:#fff;border-radius:8px;padding:6px 10px;font:600 13px var(--sans);cursor:pointer}
  nav.tabs{display:flex;gap:4px;flex-wrap:wrap;margin:18px 0 14px;border-bottom:1px solid var(--line)}
  nav.tabs button{background:none;border:0;border-bottom:3px solid transparent;padding:10px 14px;font:600 15px var(--sans);color:var(--muted);cursor:pointer}
  nav.tabs button[aria-selected="true"]{color:var(--navy);border-bottom-color:var(--teal)}
  nav.tabs .count{display:inline-block;min-width:20px;padding:1px 6px;margin-left:6px;border-radius:10px;background:#B42318;color:#fff;font-size:12px}
  .kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:12px;margin-bottom:16px}
  .kpi{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:14px 16px}
  .kpi b{display:block;font-size:24px}
  .casecols{display:grid;gap:14px;align-items:start}
  .casecols.cols2{grid-template-columns:1fr 1fr}
  .casecols.cols3{grid-template-columns:1fr 1fr 1fr}
  @media (max-width:860px){.casecols.cols2,.casecols.cols3{grid-template-columns:1fr}}
  .casecol{min-height:60px}
  .box .boxhead{display:flex;align-items:center;gap:8px;cursor:pointer;user-select:none}
  .box .grip{cursor:grab;color:var(--soft);font-size:18px;line-height:1;padding:2px 4px}
  .box .chev{color:var(--muted);font-size:14px;width:14px}
  .box.dragging{opacity:.5;outline:2px dashed var(--teal)}
  button.kpi{text-align:left;font:inherit;color:inherit;cursor:pointer}
  button.kpi:hover{border-color:var(--teal);box-shadow:0 1px 4px rgba(20,33,61,.08)}
  .kpi span{font-size:13px;color:var(--muted)}
  table.t{width:100%;border-collapse:collapse;background:var(--card);border:1px solid var(--line);border-radius:12px;overflow:hidden;font-size:14px}
  table.t th,table.t td{padding:9px 10px;text-align:left;border-bottom:1px solid var(--line);vertical-align:top}
  table.t th{background:#F0F2F6;font-size:12px;text-transform:uppercase;letter-spacing:.03em;color:var(--muted)}
  table.t tr.click{cursor:pointer}
  table.t tr.click:hover td{background:#F7F9FB}
  .tablebox{overflow-x:auto}
  .pill{display:inline-block;padding:2px 8px;border-radius:10px;font-size:12px;font-weight:600;background:#E8ECF2;color:#3E4A5C;white-space:nowrap;margin:1px 2px 1px 0}
  .pill.red{background:#FDECEA;color:#8A1C12}.pill.green{background:#E6F4EA;color:#174F27}.pill.amber{background:#FFF4DB;color:#7A4D00}.pill.teal{background:var(--teal-tint);color:var(--teal-dark)}
  .row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
  .sbtn{min-height:38px;padding:0 14px;border-radius:8px;border:2px solid var(--navy);background:#fff;color:var(--navy);font:600 14px var(--sans);cursor:pointer}
  .sbtn.primary{background:var(--teal);border-color:var(--teal);color:#fff}
  .sbtn.danger{border-color:#B42318;color:#B42318}
  .sbtn[disabled]{opacity:.5;cursor:not-allowed}
  .grid2{display:grid;grid-template-columns:1fr 1fr;gap:14px}
  @media (max-width:860px){.grid2{grid-template-columns:1fr}}
  .kv{display:grid;grid-template-columns:170px 1fr;gap:4px 12px;font-size:14px}
  .kv dt{color:var(--muted)}
  .kv dd{margin:0;overflow-wrap:anywhere}
  textarea.big{width:100%;min-height:300px;border:1px solid #9AA6B8;border-radius:10px;padding:12px;font:400 15px/1.5 var(--sans)}
  textarea.small{width:100%;min-height:80px;border:1px solid #9AA6B8;border-radius:10px;padding:10px;font:400 14px/1.45 var(--sans)}
  select.sm,input.sm{min-height:38px;border:1px solid #9AA6B8;border-radius:8px;padding:0 10px;font:400 14px var(--sans);background:#fff}
  .code{font:600 22px/1 ui-monospace,Menlo,Consolas,monospace;letter-spacing:3px;background:#F0F2F6;padding:10px 14px;border-radius:8px;display:inline-block}
  .muted{color:var(--muted);font-size:13px}
  .back{background:none;border:0;color:var(--teal);font:600 15px var(--sans);cursor:pointer;padding:6px 0}
  h2.sec{font-size:17px;margin:0}
  .msg{position:fixed;left:50%;bottom:20px;transform:translateX(-50%);background:var(--navy);color:#fff;padding:10px 16px;border-radius:10px;font-size:14px;z-index:9}
  pre.ans{white-space:pre-wrap;font:400 13px/1.45 ui-monospace,Menlo,Consolas,monospace;background:#F7F9FB;border:1px solid var(--line);border-radius:8px;padding:10px;max-height:260px;overflow:auto;margin:0}
</style>
</head>
<body>
<header class="topbar">
  <div class="awrap">
    <span class="brand"><b>Tax Letter Sorted</b><span>Admin · Accounted4Tax</span></span>
    <span class="who" id="who" hidden><span id="whoEmail"></span><button type="button" id="signout">Sign out</button></span>
  </div>
</header>

<main class="awrap" style="padding-bottom:60px">
  <!-- Sign in -->
  <section id="signin" class="stack" style="max-width:420px;margin:40px auto" hidden>
    <h1>Admin sign-in</h1>
    <form id="signinForm" class="card" novalidate>
      <label class="field"><span>Email</span><input id="siEmail" type="email" autocomplete="username"></label>
      <label class="field"><span>Password</span><input id="siPass" type="password" autocomplete="current-password"></label>
      <p class="error" id="siErr" hidden></p>
      <button class="btn" type="submit" id="siBtn">Sign in</button>
    </form>
    <p class="note">Only the accounts listed for the admin page can sign in.</p>
  </section>

  <section id="app" hidden>
    <nav class="tabs" role="tablist">
      <button type="button" data-tab="queue" aria-selected="true">Work queue<span class="count" id="cQueue" hidden></span></button>
      <button type="button" data-tab="cases">Cases</button>
      <button type="button" data-tab="quotes">Quotes<span class="count" id="cQuote" hidden></span></button>
      <button type="button" data-tab="requests">Requests<span class="count" id="cReq" hidden></span></button>
      <button type="button" data-tab="emails">Emails<span class="count" id="cMail" hidden></span></button>
      <button type="button" data-tab="funnel">Funnel</button>
      <button type="button" data-tab="data">Export &amp; data</button>
    </nav>
    <div id="view"></div>
  </section>
</main>

<script type="module">
import { composeAppeal } from "./js/appeal-text.js";

const CFG = window.TLS_CONFIG;
const SB = CFG.functionsUrl.replace(/\/functions\/v1$/, "");
// Public (anon) key: safe in the page – it only allows sign-in. All data access goes through the admin function.
const ANON = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InBtbmdhcHB1YXR1bmJob2RxaXBuIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTI3ODcxOTMsImV4cCI6MjEwODM2MzE5M30.fj8PdtESWntg0v_BCzLbfiCVkrT7-f1t7wdi83UmYXc";
// Allowed values copied from pg_constraint (cases_status_check, help_requests_status_check, callbacks_status_check) on 1 Nov 2026
const STATUSES = ["uploaded","explained","questions","outcome","callback_requested","awaiting_payment","paid","awaiting_id","in_review","awaiting_hmrc_code","awaiting_signature","approved","sent","submitted","posted","closed","deleted"];
const REQ_STATUSES = ["new","contacted","client","closed"];
const CB_STATUSES = ["new","called","link_sent","no_appeal","closed"];
const TYPE = { "sa-late-filing-100": "SA late filing £100", "sa-late-filing-later": "SA late filing (later)", "sa-late-payment": "SA late payment",
  "ct-late-filing": "Corporation Tax late filing", "companies-house-late-filing": "Companies House late filing",
  "vat-late-submission": "VAT late submission", "paye-employer-penalty": "PAYE late filing", "cis-late-return": "CIS late return",
  "sa-statement": "SA statement / debt", "mtd-income-tax": "MTD for Income Tax", "companies-house-strike-off": "Companies House strike-off" };
const BIZ = ["vat-late-submission", "paye-employer-penalty", "cis-late-return"];
const PRODUCT = { option1: "Free", option2: "£19 self-serve", option3: "Accountant review", appointment: "£59 appointment", call: "Call" };
const TODO = { id_not_started: ["ID not started", "amber"], waiting_for_id: ["Waiting for ID", "amber"], confirm_call: ["Confirm call time", "red"],
  request_hmrc_code: ["Request HMRC code", "red"], hmrc_code_received: ["HMRC code received", "green"], write_appeal: ["Write appeal", "teal"],
  waiting_for_times: ["Waiting for call times", "amber"], hold_appointment: ["Hold the appointment", "teal"],
  send_asa_link: ["Send ASA link", "red"], request_agent_code: ["Request agent code", "red"], file_confirmation_statement: ["File confirmation statement", "teal"] };

const $ = (id) => document.getElementById(id);
// reasons per letter type come from the rules files; labels from the English language file
let EN = null;
const labelOf = (key) => { const v = String(key || "").split(".").reduce((o, k) => (o || {})[k], EN || {}); return typeof v === "string" ? v : key; };
async function loadRules(id) {
  const d = await fetch("rules/" + id + ".json", { cache: "no-store" }).then((r) => r.json());
  const parent = d.inherits_from || d.inherits;
  return parent ? Object.assign({}, await loadRules(parent), d) : d;
}
async function reasonsFor(letterType) {
  if (!EN) EN = await fetch("lang/en.json", { cache: "no-store" }).then((r) => r.json()).catch(() => ({}));
  try {
    const r = await loadRules(letterType), ex = r.exclude_reasons || [];
    return (r.reasons_list || r.reasons || []).filter((x) => !ex.includes(x.id)).map((x) => ({ id: x.id, label: labelOf(x.label_key) }));
  } catch (e) { return []; }
}
function el(tag, attrs, kids) {
  const n = document.createElement(tag);
  for (const [k, v] of Object.entries(attrs || {})) {
    if (k === "text") n.textContent = v; else if (k.startsWith("on")) n.addEventListener(k.slice(2), v);
    else if (v === true) n.setAttribute(k, ""); else if (v !== false && v != null) n.setAttribute(k, v);
  }
  for (const c of [].concat(kids ?? [])) if (c != null && c !== false) n.appendChild(typeof c === "string" ? document.createTextNode(c) : c);
  return n;
}
const pill = (t, cls) => el("span", { class: "pill " + (cls || ""), text: t });
const d = (iso) => !iso ? "–" : /^\d{4}-\d{2}$/.test(String(iso)) ? new Date(iso + "-01T00:00:00Z").toLocaleDateString("en-GB", { month: "short", year: "numeric" })
  : new Date(String(iso).length === 10 ? iso + "T00:00:00Z" : iso).toLocaleDateString("en-GB", { day: "numeric", month: "short", year: "numeric" });
const dt = (iso) => iso ? new Date(iso).toLocaleString("en-GB", { day: "numeric", month: "short", hour: "2-digit", minute: "2-digit" }) : "–";
const money = (p) => p == null ? "–" : "£" + (p / 100).toFixed(2);
const daysLeft = (iso) => iso ? Math.ceil((new Date(iso + "T23:59:59Z") - new Date()) / 864e5) : null;
function toast(t) { const m = el("div", { class: "msg", role: "status", text: t }); document.body.appendChild(m); setTimeout(() => m.remove(), 2600); }
function store(k, v) { try { v == null ? sessionStorage.removeItem(k) : sessionStorage.setItem(k, v); } catch (e) {} }
function load(k) { try { return sessionStorage.getItem(k); } catch (e) { return null; } }

// ---------- sign-in (Supabase Auth, email + password) ----------
async function auth(grant, body) {
  const r = await fetch(`${SB}/auth/v1/token?grant_type=${grant}`, { method: "POST", headers: { "Content-Type": "application/json", apikey: ANON }, body: JSON.stringify(body) });
  const j = await r.json().catch(() => ({}));
  if (!r.ok || !j.access_token) throw new Error(j.error_description || j.msg || "Sign-in failed");
  store("tls_admin_at", j.access_token); store("tls_admin_rt", j.refresh_token);
  return j;
}
async function api(action, payload = {}, retry = true) {
  const r = await fetch(`${CFG.functionsUrl}/admin`, { method: "POST",
    headers: { "Content-Type": "application/json", Authorization: "Bearer " + (load("tls_admin_at") || "") }, body: JSON.stringify({ action, ...payload }) });
  const j = await r.json().catch(() => ({}));
  if (r.status === 401 && retry && load("tls_admin_rt")) {
    try { await auth("refresh_token", { refresh_token: load("tls_admin_rt") }); return api(action, payload, false); } catch (e) {}
  }
  if (r.status === 401 || r.status === 403) { showSignin(r.status === 403 ? "This account is not allowed to use the admin page." : null); throw new Error("signin"); }
  if (!r.ok) throw new Error(j.error || "server");
  return j;
}
function showSignin(msg) {
  store("tls_admin_at", null); store("tls_admin_rt", null);
  $("app").hidden = true; $("who").hidden = true; $("signin").hidden = false;
  $("siErr").hidden = !msg; $("siErr").textContent = msg || "";
}
$("signinForm").addEventListener("submit", async (e) => {
  e.preventDefault(); $("siBtn").disabled = true; $("siErr").hidden = true;
  try { await auth("password", { email: $("siEmail").value.trim(), password: $("siPass").value }); $("siPass").value = ""; await start(); }
  catch (err) { if (err.message !== "signin") { $("siErr").textContent = "Email or password not recognised."; $("siErr").hidden = false; } }
  $("siBtn").disabled = false;
});
$("signout").addEventListener("click", () => showSignin(null));

// ---------- tabs ----------
let tab = "queue";
document.querySelectorAll("[data-tab]").forEach((b) => b.addEventListener("click", () => { openTab(b.dataset.tab); }));
function openTab(name) {
  tab = name;
  document.querySelector("main.awrap").style.maxWidth = "";
  document.querySelectorAll("[data-tab]").forEach((b) => b.setAttribute("aria-selected", String(b.dataset.tab === name)));
  ({ queue: showQueue, cases: showCases, quotes: showQuotes, requests: showRequests, emails: showEmails, funnel: showFunnel, data: showData })[name]();
}
function busy() { $("view").innerHTML = ""; $("view").appendChild(el("div", { class: "spinner", style: "margin:40px auto" })); }
function fail(e) { if (e.message !== "signin") { $("view").innerHTML = ""; $("view").appendChild(el("p", { class: "error", text: "Something went wrong (" + e.message + "). Try again." })); } }

async function start() {
  const me = await api("me");
  $("whoEmail").textContent = me.email + (me.live ? "" : " · preview (not live)") + (me.payments_test ? " · Stripe test" : "");
  $("signin").hidden = true; $("who").hidden = false; $("app").hidden = false;
  openTab("queue");
}

// ---------- Work queue ----------
async function showQueue() {
  busy();
  try {
    const o = await api("overview");
    const v = $("view"); v.innerHTML = "";
    $("cQueue").hidden = !o.queue.length; $("cQueue").textContent = o.queue.length;
    $("cReq").hidden = !(o.new_requests + o.new_callbacks); $("cReq").textContent = o.new_requests + o.new_callbacks;
    $("cMail").hidden = !o.email_problems; $("cMail").textContent = o.email_problems;
    $("cQuote").hidden = !o.new_quotes; $("cQuote").textContent = o.new_quotes;
    // each box opens the matching list
    const kpi = (n, label, go) => el("button", { type: "button", class: "kpi", onclick: go }, [el("b", { text: String(n) }), el("span", { text: label })]);
    v.appendChild(el("div", { class: "kpis" }, [
      kpi(o.queue.length, "Accountant reviews open", () => { const t = $("queueTable"); if (t) t.scrollIntoView({ behavior: "smooth" }); }),
      kpi(o.new_quotes || 0, "New quote requests (accounts + CT)", () => openTab("quotes")),
      kpi(o.new_requests + o.new_callbacks, "New requests / call-backs", () => openTab("requests")),
      kpi(o.option2_unsent, "£19 paid, appeal not emailed yet", () => { caseFilter = "option2"; openTab("cases"); }),
      kpi(o.email_problems, "Email problems (bounced / failed)", () => { emailProblemsOnly = true; openTab("emails"); }),
      kpi(money(o.takings_30d_pence), "Paid in the last 30 days", () => { caseFilter = "paid"; openTab("cases"); }),
    ]));
    if (!o.queue.length) { v.appendChild(el("p", { class: "success", text: "Nothing waiting. All accountant reviews are done." })); return; }
    const rows = o.queue.map((q) => {
      const left = daysLeft(q.appeal_deadline);
      const contact = q.contact ? (q.contact.method === "phone"
        ? `Call ${q.contact.phone || ""}${q.contact.confirmed_at ? " (confirmed)" : ""}` : `Email ${q.contact.email || ""}`) : "–";
      return el("tr", { class: "click", onclick: () => openCase(q.ref) }, [
        el("td", {}, [el("b", { text: q.ref })]),
        el("td", { text: q.company || q.name || "–" }),
        el("td", { text: TYPE[q.letter_type] || q.letter_type }),
        el("td", {}, [el("span", { text: d(q.appeal_deadline) }), left != null ? el("div", { class: "muted", text: left < 0 ? "passed" : left + " days left" }) : null]),
        el("td", {}, q.todo.map((k) => pill((TODO[k] || [k])[0], (TODO[k] || [])[1]))),
        el("td", { text: contact }),
      ]);
    });
    v.appendChild(el("div", { class: "tablebox", id: "queueTable" }, [el("table", { class: "t" }, [
      el("thead", {}, [el("tr", {}, ["Case", "Client", "Letter", "Deadline", "To do", "Contact"].map((h) => el("th", { text: h })))]),
      el("tbody", {}, rows)])]));
    v.appendChild(el("p", { class: "muted", style: "margin-top:8px", text: "Sorted by appeal deadline. Click a case to open it." }));
  } catch (e) { fail(e); }
}

// ---------- Cases ----------
let caseFilter = "paid";
async function showCases() {
  busy();
  try {
    const { cases } = await api("cases", { filter: caseFilter });
    const v = $("view"); v.innerHTML = "";
    const sel = el("select", { class: "sm", onchange: (e) => { caseFilter = e.target.value; showCases(); } },
      [["paid", "Paid options (£19 / review)"], ["option3", "Accountant reviews"], ["appointment", "£59 appointments"], ["option2", "£19 self-serve"], ["active", "All with data"], ["all", "All (latest 300)"]]
        .map(([k, t]) => el("option", { value: k, text: t, selected: k === caseFilter })));
    const search = el("input", { class: "sm", placeholder: "Search ref, name, email, company", style: "min-width:260px" });
    v.appendChild(el("div", { class: "row", style: "margin-bottom:12px" }, [sel, search]));
    const body = el("tbody");
    const render = () => {
      const q = search.value.trim().toLowerCase();
      body.innerHTML = "";
      cases.filter((c) => !q || [c.ref, c.name, c.email, c.company].some((x) => String(x || "").toLowerCase().includes(q))).forEach((c) => {
        const flags = [];
        if (c.data_deleted_at) flags.push(pill("data deleted"));
        if (c.last_email && ["bounced", "failed", "complaint"].includes(c.last_email.status)) flags.push(pill("email " + c.last_email.status, "red"));
        if (c.product === "option3" && c.paid_pence && !c.id_completed_at) flags.push(pill("no ID yet", "amber"));
        if (c.hmrc_code_at) flags.push(pill("HMRC code", "green"));
        if (c.sent_at) flags.push(pill("appeal emailed", "green"));
        body.appendChild(el("tr", { class: "click", onclick: () => openCase(c.ref) }, [
          el("td", {}, [el("b", { text: c.ref }), el("div", { class: "muted", text: d(c.created_at) })]),
          el("td", {}, [el("span", { text: c.company || c.name || "–" }), el("div", { class: "muted", text: c.email || "" })]),
          el("td", { text: TYPE[c.letter_type] || c.letter_type || "–" }),
          el("td", {}, [el("span", { text: PRODUCT[c.product] || c.product || "–" }), el("div", { class: "muted", text: c.paid_pence ? "paid " + money(c.paid_pence) : "" })]),
          el("td", {}, [pill(c.status || "–")]),
          el("td", { text: d(c.appeal_deadline) }),
          el("td", {}, flags),
        ]));
      });
    };
    search.addEventListener("input", render); render();
    v.appendChild(el("div", { class: "tablebox" }, [el("table", { class: "t" }, [
      el("thead", {}, [el("tr", {}, ["Case", "Client", "Letter", "Option", "Status", "Deadline", ""].map((h) => el("th", { text: h })))]), body])]));
  } catch (e) { fail(e); }
}

// ---------- One case ----------
async function openCase(ref) {
  busy();
  let r;
  try { r = await api("case", { ref }); } catch (e) { return fail(e); }
  const c = r.case, det = c.details || {}, v = $("view"); v.innerHTML = ""; v.dataset.ref = c.ref;
  const company = c.letter_type === "ct-late-filing" || c.letter_type === "companies-house-late-filing" || c.letter_type === "companies-house-strike-off";
  const biz = BIZ.includes(c.letter_type);
  const paid = r.payments.find((p) => p.status === "paid");
  v.appendChild(el("button", { class: "back", type: "button", text: "← Back", onclick: () => openTab(tab) }));
  v.appendChild(el("div", { class: "row", style: "margin:6px 0 14px" }, [
    el("h1", { style: "margin:0", text: c.ref }), pill(PRODUCT[c.product] || c.product || "–", "teal"), pill(c.status || "–"),
    c.data_deleted_at ? pill("data deleted " + d(c.data_deleted_at), "red") : null,
  ]));
  const grid = el("div", { class: "grid2" }); v.appendChild(grid);
  const left = el("div", { class: "stack" }), right = el("div", { class: "stack" });
  grid.appendChild(left); grid.appendChild(right);

  // Summary

// ---------- case page layout: collapsible boxes you can drag into 2 or 3 columns (saved in this browser) ----------
const LAYOUT_KEY = "tls_admin_case_layout_v1";
const FIXED_OPEN = ["case", "client"];               // always open
const DEFAULT_CLOSED = ["quote", "history"];
function loadLayout() { try { return JSON.parse(localStorage.getItem(LAYOUT_KEY)) || {}; } catch (e) { return {}; } }
function saveLayout(l) { try { localStorage.setItem(LAYOUT_KEY, JSON.stringify(l)); } catch (e) {} }
function cardKey(title) {
  const t = title.toLowerCase();
  if (t === "case") return "case";
  if (t === "client" || t.startsWith("company and director")) return "client";
  if (t.startsWith("create a quote")) return "quote";
  if (t.startsWith("hmrc agent")) return "hmrc";
  if (t.startsWith("how they want")) return "contact";
  if (t.startsWith("client's answers")) return "answers";
  return t.replace(/[^a-z]+/g, "_").replace(/^_|_$/g, "");
}
function arrangeCase(grid, left, right, view) {
  const layout = loadLayout();
  const cards = {};
  const defaults2 = [[], []];
  [left, right].forEach((col, ci) => Array.from(col.children).forEach((sec) => {
    // turn each box into: header (drag handle · title · open/close) + body
    let title = "", body = [];
    const det = sec.firstElementChild && sec.firstElementChild.tagName === "DETAILS" ? sec.firstElementChild : null;
    if (det) { title = det.querySelector("summary").textContent; body = Array.from(det.children).filter((x) => x.tagName !== "SUMMARY"); }
    else { const h = sec.querySelector(":scope > h2"); title = h ? h.textContent : "Box"; body = Array.from(sec.children).filter((x) => x !== h); }
    const key = cardKey(title);
    sec.innerHTML = ""; sec.dataset.key = key; sec.classList.add("box");
    const fixed = FIXED_OPEN.includes(key);
    const closed = !fixed && (layout.closed ? layout.closed.includes(key) : DEFAULT_CLOSED.includes(key));
    const wrap = el("div", { class: "stack boxbody", hidden: closed }, body);
    const chev = el("span", { class: "chev", text: fixed ? "" : closed ? "▸" : "▾" });
    const head = el("div", { class: "boxhead" }, [el("span", { class: "grip", title: "Drag to move", text: "⠿" }), el("h2", { class: "sec", style: "flex:1", text: title }), chev]);
    if (!fixed) head.addEventListener("click", (e) => {
      if (e.target.classList.contains("grip")) return;
      wrap.hidden = !wrap.hidden; chev.textContent = wrap.hidden ? "▸" : "▾";
      const l = loadLayout(); const cl = new Set(l.closed || DEFAULT_CLOSED);
      wrap.hidden ? cl.add(key) : cl.delete(key); l.closed = [...cl]; saveLayout(l);
    });
    sec.append(head, wrap);
    // only the ⠿ handle starts a drag, so typing and selecting text inside boxes still works
    const grip = head.querySelector(".grip");
    grip.addEventListener("mousedown", () => { sec.draggable = true; });
    grip.addEventListener("mouseup", () => { sec.draggable = false; });
    cards[key] = sec; defaults2[ci].push(key);
  }));
  const all = Object.keys(cards);
  const defaults3 = [["case", "client", "charge_the_client", "quote"], ["contact", "documents", "hmrc", "answers"], ["write_the_appeal", "status_and_notes", "emails", "history"]];
  // columns switch
  const n = layout.columns === 3 ? 3 : 2;
  const saved = (layout["cols" + n] || (n === 3 ? defaults3 : defaults2)).map((c) => c.filter((k) => cards[k]));
  all.filter((k) => !saved.flat().includes(k)).forEach((k) => saved[0].push(k));   // new boxes go to the first column
  grid.innerHTML = ""; grid.className = "casecols cols" + n;
  document.querySelector("main.awrap").style.maxWidth = n === 3 ? "1560px" : "";   // more room for 3 columns
  const cols = saved.map((keys) => { const col = el("div", { class: "stack casecol" }); keys.forEach((k) => col.appendChild(cards[k])); grid.appendChild(col); return col; });
  // drag and drop
  let dragging = null;
  const persist = () => { const l = loadLayout(); l["cols" + n] = cols.map((col) => Array.from(col.children).map((x) => x.dataset.key)); saveLayout(l); };
  Object.values(cards).forEach((sec) => {
    sec.addEventListener("dragstart", (e) => { dragging = sec; sec.classList.add("dragging"); e.dataTransfer.effectAllowed = "move"; });
    sec.addEventListener("dragend", () => { sec.classList.remove("dragging"); sec.draggable = false; dragging = null; persist(); });
  });
  cols.forEach((col) => col.addEventListener("dragover", (e) => {
    if (!dragging) return; e.preventDefault();
    const after = Array.from(col.children).filter((x) => x !== dragging).find((x) => e.clientY < x.getBoundingClientRect().top + x.offsetHeight / 2);
    after ? col.insertBefore(dragging, after) : col.appendChild(dragging);
  }));
  // toolbar: 2 / 3 columns, reset
  const bar = el("div", { class: "row", style: "justify-content:flex-end;margin:-6px 0 10px" }, [
    el("span", { class: "muted", text: "Drag a box by ⠿ to move it ·" }),
    ...[2, 3].map((k) => el("button", { class: "sbtn" + (k === n ? " primary" : ""), type: "button", text: k + " columns",
      onclick: () => { const l = loadLayout(); l.columns = k; saveLayout(l); openCase(view.dataset.ref); } })),
    el("button", { class: "sbtn", type: "button", text: "Reset layout", onclick: () => { saveLayout({}); openCase(view.dataset.ref); } })]);
  grid.parentNode.insertBefore(bar, grid);
}

// ---------- Quotes (accounts + Corporation Tax return, penalty appeal free) ----------
function parseQuote(note) {
  const q = { company: null, number: null, auth: null, total: null, answers: null, monthly: null, extra: [] };
  String(note || "").split(" · ").forEach((p) => {
    const json = (x) => { try { return JSON.parse(x.slice(x.indexOf(" – ") + 3)); } catch (e) { return null; } };
    if (p.startsWith("[Quote")) return;
    if (p.startsWith("Company number: ")) q.number = p.slice(16);
    else if (p.startsWith("Company: ")) q.company = p.slice(9);
    else if (p.startsWith("Companies House authentication code: ")) q.auth = p.slice(37);
    else if (p.startsWith("CATCH-UP ESTIMATE £") || p.startsWith("ESTIMATE £")) { q.total = Number(p.match(/£([\d.]+)/)[1]); q.answers = json(p); }
    else if (p.startsWith("MONTHLY FROM NOW £")) q.monthly = json(p);
    else if (p.startsWith("Case: ")) q.case = p.slice(6);
    else q.extra.push(p);
  });
  return q;
}
function quoteLines(a) {
  if (!a) return [];
  const L = [a.dormant ? "Dormant company" : "Trading company", `Overdue year-ends: ${a.years}`];
  if (a.transactions != null) L.push(`Bookkeeping not done – about ${a.transactions} transactions`);
  if (a.software) L.push(`Books kept in: ${a.software}`);
  if (a.directors) L.push(`Directors: ${a.directors}`);
  if (a.director_returns_missing) L.push(`Directors' tax returns missing: ${a.director_returns_missing}`);
  if (a.payroll) L.push(`Payroll: ${a.payroll.employees} employees, ${a.payroll.months} months not submitted`);
  if (a.cis) L.push(`CIS: ${a.cis.subcontractors} subcontractors, ${a.cis.months} months not submitted`);
  if (a.vat) L.push(`VAT: ${a.vat.months} months not submitted`);
  if (a.confirmation_statement) L.push("Confirmation statement due");
  return L;
}

async function qapi(action, payload = {}) {

async function downloadQuote(id) {
  try {
    const x = await qapi("pdf", { id });
    const bytes = Uint8Array.from(atob(x.pdf), (ch) => ch.charCodeAt(0));

    setTimeout(() => URL.revokeObjectURL(url), 30000);

function csv(rows) {
  if (!rows.length) return "";
  const cols = Object.keys(rows[0]);
  const q = (x) => { const s = x == null ? "" : typeof x === "object" ? JSON.stringify(x) : String(x); return /[",\n]/.test(s) ? '"' + s.replace(/"/g, '""') + '"' : s; };
  return [cols.join(","), ...rows.map((r) => cols.map((c) => q(r[c])).join(","))].join("\n");
}
function showData() {
  const v = $("view"); v.innerHTML = "";

    el("div", { class: "row" }, ["customers", "cases", "payments", "emails"].map((w) => el("button", { class: "sbtn", type: "button", text: "Download " + w, onclick: async () => {
      try {
        const { rows } = await api("export", { what: w });
        const blob = new Blob(["﻿" + csv(rows)], { type: "text/csv;charset=utf-8" });
        const a = el("a", { href: URL.createObjectURL(blob), download: `tax-letter-sorted-${w}-${new Date().toISOString().slice(0, 10)}.csv` });
        document.body.appendChild(a); a.click(); a.remove(); toast(rows.length + " rows");
      } catch (e) { toast("Export failed"); }
    } })))]));

  const em = el("input", { class: "sm", type: "email", placeholder: "client@example.com", style: "min-width:260px" });
  const out = el("div", { class: "stack" });
  const box = el("section", { class: "card", style: "margin-top:14px" }, [el("h2", { class: "sec", text: "Delete a person's data (GDPR request)" }),
    el("p", { class: "muted", text: "Find everything held for an email address first. Accountant-review cases (paid) are client engagements and are kept for the AML period unless you tick the box." }),
    el("div", { class: "row" }, [em, el("button", { class: "sbtn", type: "button", text: "Find", onclick: find })]), out]);
  v.appendChild(box);
  async function find() {

      c.kept_for_aml ? pill("kept for AML", "amber") : null, c.data_deleted_at ? pill("already deleted") : null])));
    if (!r.customers.length && !r.cases.length && !r.help_requests && !r.callbacks) return;
    const inc = el("input", { type: "checkbox" });

    out.appendChild(el("button", { class: "sbtn danger", type: "button", text: "Delete this person's data", onclick: async () => {
