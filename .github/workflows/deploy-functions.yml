# Deploys Supabase Edge Functions (server code) from this repo.
# - On every push to main that changes supabase/functions/<name>/..., only the changed functions are deployed.
# - Can also be run by hand (Actions → Deploy Supabase functions → Run workflow) for one function or "all".
# Needs the repository secret SUPABASE_ACCESS_TOKEN (Supabase token limited to this project: Edge Functions read-write).
name: Deploy Supabase functions

on:
  push:
    branches: [main]
    paths: ["supabase/functions/**"]
  workflow_dispatch:
    inputs:
      function:
        description: "Function folder name, or 'all'"
        required: true
        default: "all"

concurrency: deploy-functions

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      PROJECT_REF: pmngappuatunbhodqipn
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: supabase/setup-cli@v1
        with:
          version: latest
      - name: Work out which functions to deploy
        id: pick
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            if [ "${{ inputs.function }}" = "all" ]; then
              LIST=$(ls -d supabase/functions/*/ | xargs -n1 basename)
            else
              LIST="${{ inputs.function }}"
            fi
          else
            LIST=$(git diff --name-only ${{ github.event.before }} ${{ github.sha }} -- supabase/functions | cut -d/ -f3 | sort -u)
          fi
          echo "Functions: $LIST"
          echo "list=$(echo $LIST | tr '\n' ' ')" >> "$GITHUB_OUTPUT"
      - name: Deploy
        run: |
          for f in ${{ steps.pick.outputs.list }}; do
            if [ -f "supabase/functions/$f/index.ts" ]; then
              echo "::group::$f"
              # all our functions check their own access (preview code, admin sign-in, secrets), so no Supabase JWT check
              supabase functions deploy "$f" --project-ref "$PROJECT_REF" --no-verify-jwt --use-api
              echo "::endgroup::"
            fi
          done
